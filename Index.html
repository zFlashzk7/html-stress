<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>KILLER STRESSER</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Arial', 'Helvetica', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #000000; /* fundo externo preto */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* splash screen - centralizado no mobile */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s ease;
        }

        .splash-title {
            color: #7800ff;
            font-size: clamp(2.5rem, 10vw, 5rem);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 8px;
            opacity: 0;
            animation: fadeIn 2s forwards;
            text-align: center;
            width: 100%;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* tela de seleção - só mobile/pc */
        .selection-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 900;
            transition: opacity 0.8s ease;
        }

        .selection-box {
            background: transparent;
            text-align: center;
        }

        .selection-box p {
            color: #ffffff;
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        .selection-buttons {
            display: flex;
            gap: 30px;
            justify-content: center;
        }

        .selection-btn {
            background: #000000;
            border: 3px solid #7800ff;
            border-radius: 16px;
            color: #7800ff;
            font-size: 1.8rem;
            font-weight: bold;
            padding: 10px 40px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            min-width: 140px;
        }

        .selection-btn:hover {
            background: #7800ff;
            color: black;
        }

        .hidden {
            display: none;
        }

        /* container principal - fundo preto */
        .container {
            width: 100%;
            max-width: 1100px;
            background: transparent;
        }

        /* título roxo fora do launch attack */
        .main-title {
            color: #7800ff;
            font-size: 3.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 2px;
            text-align: center;
        }

        /* launch attack box - degradê mais preto que cinza */
        .launch-box {
            background: linear-gradient(180deg, #1a1a1a 0%, #000000 100%);
            border: 3px solid #7800ff;
            border-radius: 24px;
            padding: 30px 35px;
            box-shadow: 0 0 30px rgba(120, 0, 255, 0.3);
        }

        /* título interno */
        .launch-title {
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
            border-bottom: 2px solid #7800ff;
            padding-bottom: 10px;
        }

        /* botões layer */
        .layer-buttons {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .layer-btn {
            background: transparent;
            border: 3px solid #7800ff;
            border-radius: 16px;
            color: #7800ff;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 8px 30px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .layer-btn.active {
            background: #7800ff;
            color: black;
        }

        /* campos */
        .field-label {
            color: #aaaaaa;
            font-size: 0.9rem;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .field-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            border: 3px solid #7800ff;
            border-radius: 16px;
            padding: 14px 18px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .field-input::placeholder {
            color: #555555;
            font-style: italic;
        }

        /* método (dropdown) */
        .method-selector {
            position: relative;
            width: 100%;
        }

        .method-display {
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            border: 3px solid #7800ff;
            border-radius: 16px;
            padding: 14px 18px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .method-display::after {
            content: "▼";
            font-size: 0.8rem;
            color: #7800ff;
        }

        .method-dropdown {
            position: absolute;
            top: 110%;
            left: 0;
            right: 0;
            background: #1a1a1a;
            border: 3px solid #7800ff;
            border-radius: 16px;
            max-height: 250px;
            overflow-y: auto;
            display: none;
            z-index: 10;
        }

        .method-dropdown.show {
            display: block;
        }

        .method-item {
            padding: 12px 16px;
            color: white;
            cursor: pointer;
            border-bottom: 1px solid #333;
        }

        .method-item:hover {
            background: #7800ff;
            color: black;
        }

        /* barra de progresso - embaixo do botão */
        .progress-area {
            margin-top: 20px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background: #222222;
            border: 2px solid #333;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #7800ff;
            transition: width 0.3s linear;
            border-radius: 20px;
        }

        .time-display {
            text-align: right;
            color: #aaaaaa;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        /* botão attack - letras minúsculas */
        .attack-btn {
            background: #7800ff;
            border: none;
            border-radius: 20px;
            color: white;
            font-size: 2rem;
            font-weight: bold;
            padding: 12px 20px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: lowercase; /* minúsculas */
            width: 100%;
            margin: 15px 0 5px;
            box-shadow: 0 0 20px #7800ff;
        }

        .attack-btn:first-letter {
            text-transform: uppercase; /* primeira letra maiúscula */
        }

        .attack-btn.loading {
            background: #333333;
            box-shadow: none;
            color: #888888;
            cursor: wait;
            position: relative;
        }

        .attack-btn.loading::after {
            content: "◌";
            margin-left: 15px;
            font-size: 2rem;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        .attack-btn.sent {
            background: #00aa00;
            box-shadow: 0 0 20px #00aa00;
            color: white;
        }

        .attack-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* layout mobile (padrão) */
        .grid-mobile {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* layout pc */
        .grid-pc {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px 30px;
            align-items: start;
        }

        .grid-pc .field-full {
            grid-column: span 2;
        }

        .grid-pc .attack-btn {
            grid-column: span 2;
        }

        .grid-pc .progress-area {
            grid-column: span 2;
        }

        /* responsivo */
        @media (max-width: 700px) {
            .launch-box {
                padding: 20px 15px;
            }
            .main-title {
                font-size: 2.5rem;
            }
            .layer-btn {
                font-size: 1.2rem;
                padding: 8px 20px;
            }
            .selection-btn {
                font-size: 1.5rem;
                padding: 8px 30px;
                min-width: 120px;
            }
        }
    </style>
</head>
<body>
    <!-- tela inicial -->
    <div class="splash-screen" id="splash">
        <div class="splash-title">KILLER STRESSER</div>
    </div>

    <!-- tela de seleção mobile/pc -->
    <div class="selection-screen hidden" id="selectionScreen">
        <div class="selection-box">
            <p>To improve your experience, select:</p>
            <div class="selection-buttons">
                <button class="selection-btn" id="selectMobile">Mobile</button>
                <button class="selection-btn" id="selectPC">Pc</button>
            </div>
        </div>
    </div>

    <!-- interface principal -->
    <div class="container hidden" id="mainInterface">
        <div class="main-title">KILLER STRESSER</div>

        <div class="launch-box">
            <div class="launch-title">launch attack</div>

            <!-- botões layer -->
            <div class="layer-buttons">
                <button class="layer-btn active" id="layer7Btn">LAYER 7</button>
                <button class="layer-btn" id="layer4Btn">LAYER 4</button>
            </div>

            <!-- grid que muda conforme mobile/pc -->
            <div id="dynamicGrid" class="grid-mobile">
                <!-- target -->
                <div>
                    <div class="field-label" id="targetLabel">DOMAIN OR URL</div>
                    <input type="text" class="field-input" id="targetInput" placeholder="example.com">
                </div>

                <!-- porta -->
                <div>
                    <div class="field-label">PORT</div>
                    <input type="number" class="field-input" id="portInput" placeholder="443" min="1" max="65535">
                </div>

                <!-- método -->
                <div>
                    <div class="field-label">METHOD</div>
                    <div class="method-selector">
                        <div class="method-display" id="methodDisplay">HTTPS-BYPASS</div>
                        <div class="method-dropdown" id="methodDropdown"></div>
                    </div>
                </div>

                <!-- tempo -->
                <div>
                    <div class="field-label">TIME (SEC)</div>
                    <input type="number" class="field-input" id="timeInput" placeholder="60" min="1">
                </div>

                <!-- concurrents -->
                <div>
                    <div class="field-label">CONCURRENTS</div>
                    <input type="number" class="field-input" id="concurrencyInput" placeholder="1" min="1" max="99999">
                </div>

                <!-- botão attack -->
                <button class="attack-btn" id="attackBtn">attack</button>

                <!-- barra de progresso (agora embaixo do botão) -->
                <div class="progress-area" id="progressArea" style="display: none;">
                    <div class="progress-bar-bg">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="time-display" id="timeDisplay"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // listas de métodos
        const layer7Methods = [
            "HTTPS-BYPASS", "HTTP-BROWSER", "HTTP-FLOOD", "HTTPS-FLOOD",
            "HTTP-BYPASS", "HTTP-POST", "HTTP-GET", "TLS-HTTP", "TLS-HTTPS",
            "HTTP-BOTNET", "HTTPS-BOTNET", "TLS-BOTNET"
        ];

        const layer4Methods = [
            "UDP-FLOOD", "TCP-SYN", "TCP-ACK", "UDP-GAME", "TCP-RST",
            "UDP-RAW", "TCP-PSH", "UDP-AMP-DNS", "TCP-AMP-CLDAP",
            "UDP-AMP-MEMCACHED", "UDP-BOTNET", "TCP-BOTNET"
        ];

        // elementos
        const splash = document.getElementById('splash');
        const selectionScreen = document.getElementById('selectionScreen');
        const mainInterface = document.getElementById('mainInterface');
        const dynamicGrid = document.getElementById('dynamicGrid');
        const selectMobile = document.getElementById('selectMobile');
        const selectPC = document.getElementById('selectPC');
        const layer7Btn = document.getElementById('layer7Btn');
        const layer4Btn = document.getElementById('layer4Btn');
        const targetLabel = document.getElementById('targetLabel');
        const targetInput = document.getElementById('targetInput');
        const portInput = document.getElementById('portInput');
        const methodDisplay = document.getElementById('methodDisplay');
        const methodDropdown = document.getElementById('methodDropdown');
        const timeInput = document.getElementById('timeInput');
        const concurrencyInput = document.getElementById('concurrencyInput');
        const progressArea = document.getElementById('progressArea');
        const progressFill = document.getElementById('progressFill');
        const timeDisplay = document.getElementById('timeDisplay');
        const attackBtn = document.getElementById('attackBtn');

        let currentLayer = '7';
        let currentMethod = 'HTTPS-BYPASS';
        let attackActive = false;
        let progressInterval = null;
        let attackTimer = null;
        let startTime = 0;
        let totalSeconds = 60;

        // valores originais para reset
        const defaultTarget = '';
        const defaultPort = '';
        const defaultTime = '';
        const defaultConcurrency = '';

        // animação inicial
        setTimeout(() => {
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.classList.add('hidden');
                selectionScreen.classList.remove('hidden');
                selectionScreen.style.opacity = '1';
            }, 1000);
        }, 3000);

        // seleção mobile/pc
        selectMobile.addEventListener('click', () => {
            dynamicGrid.className = 'grid-mobile';
            selectionScreen.classList.add('hidden');
            mainInterface.classList.remove('hidden');
        });

        selectPC.addEventListener('click', () => {
            dynamicGrid.className = 'grid-pc';
            selectionScreen.classList.add('hidden');
            mainInterface.classList.remove('hidden');
        });

        // popula dropdown
        function populateDropdown(layer) {
            const methods = layer === '7' ? layer7Methods : layer4Methods;
            methodDropdown.innerHTML = '';

            methods.forEach(method => {
                const item = document.createElement('div');
                item.className = 'method-item';
                item.textContent = method;
                item.addEventListener('click', () => {
                    currentMethod = method;
                    methodDisplay.textContent = method;
                    methodDropdown.classList.remove('show');
                });
                methodDropdown.appendChild(item);
            });

            if (!methods.includes(currentMethod)) {
                currentMethod = methods[0];
                methodDisplay.textContent = currentMethod;
            }
        }

        // toggle dropdown
        methodDisplay.addEventListener('click', (e) => {
            e.stopPropagation();
            methodDropdown.classList.toggle('show');
        });

        document.addEventListener('click', (e) => {
            if (!methodDisplay.contains(e.target) && !methodDropdown.contains(e.target)) {
                methodDropdown.classList.remove('show');
            }
        });

        // botões layer
        layer7Btn.addEventListener('click', () => {
            layer7Btn.classList.add('active');
            layer4Btn.classList.remove('active');
            currentLayer = '7';
            targetLabel.textContent = 'DOMAIN OR URL';
            targetInput.placeholder = 'example.com';
            targetInput.value = '';
            populateDropdown('7');
        });

        layer4Btn.addEventListener('click', () => {
            layer4Btn.classList.add('active');
            layer7Btn.classList.remove('active');
            currentLayer = '4';
            targetLabel.textContent = 'IP TARGET';
            targetInput.placeholder = '1.1.1.1';
            targetInput.value = '';
            populateDropdown('4');
        });

        // reseta campos
        function resetFields() {
            targetInput.value = '';
            portInput.value = '';
            timeInput.value = '';
            concurrencyInput.value = '';
        }

        // barra de progresso
        function updateProgress() {
            if (progressInterval) clearInterval(progressInterval);

            progressInterval = setInterval(() => {
                if (!attackActive) {
                    clearInterval(progressInterval);
                    progressInterval = null;
                    return;
                }

                const elapsed = (Date.now() - startTime) / 1000;
                const percent = Math.min(100, (elapsed / totalSeconds) * 100);
                progressFill.style.width = percent + '%';
                timeDisplay.textContent = `${Math.max(0, totalSeconds - elapsed).toFixed(1)}s / ${totalSeconds}s (${Math.floor(percent)}%)`;

                if (elapsed >= totalSeconds) {
                    clearInterval(progressInterval);
                    progressInterval = null;
                }
            }, 100);
        }

        // ataque
        attackBtn.addEventListener('click', () => {
            if (attackActive) return;

            const target = targetInput.value.trim();
            if (!target) {
                alert('Target inválido');
                return;
            }

            totalSeconds = parseInt(timeInput.value) || 60;
            attackActive = true;

            // desabilita botão
            attackBtn.disabled = true;

            // loading
            attackBtn.classList.add('loading');
            attackBtn.classList.remove('sent');
            attackBtn.textContent = '';

            // mostra barra de progresso
            progressArea.style.display = 'block';

            // 3 segundos simulando envio
            attackTimer = setTimeout(() => {
                attackBtn.classList.remove('loading');
                attackBtn.classList.add('sent');
                attackBtn.textContent = 'attack sent!';

                // inicia progresso real
                startTime = Date.now();
                updateProgress();

                // 1 segundo de verde
                setTimeout(() => {
                    attackBtn.classList.remove('sent');
                    attackBtn.textContent = 'attack';
                }, 1000);

                // finaliza ataque após duração real
                setTimeout(() => {
                    attackActive = false;
                    attackBtn.disabled = false;
                    attackBtn.classList.remove('sent', 'loading');
                    attackBtn.textContent = 'attack';

                    // esconde barra de progresso
                    progressArea.style.display = 'none';
                    progressFill.style.width = '0%';
                    timeDisplay.textContent = '';

                    // RESETA OS CAMPOS
                    resetFields();

                }, (totalSeconds * 1000) - 1000);

            }, 3000);
        });

        // inicializa
        populateDropdown('7');
        // limpa campos no início
        resetFields();
    </script>
</body>
</html>
