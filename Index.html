<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>KILLER STRESSER</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        /* TELA INICIAL */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s ease;
        }

        .splash-title {
            color: #7800ff;
            font-size: clamp(2rem, 8vw, 5rem);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 6px;
            opacity: 0;
            animation: fadeIn 2s forwards;
            text-align: center;
            width: 100%;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* TELA DE SELEÇÃO MOBILE/PC */
        .selection-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 900;
            transition: opacity 0.8s ease;
        }

        .selection-box {
            background: transparent;
            text-align: center;
            width: 90%;
            max-width: 600px;
        }

        .selection-box p {
            color: #7800ff;
            font-size: clamp(1.1rem, 4vw, 1.5rem);
            margin-bottom: 20px;
        }

        .selection-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .selection-btn {
            background: #000000;
            border: 3px solid #7800ff;
            border-radius: 14px;
            color: #7800ff;
            font-size: clamp(1.2rem, 5vw, 1.8rem);
            font-weight: bold;
            padding: clamp(6px, 2vw, 10px) clamp(20px, 8vw, 40px);
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .selection-btn:hover {
            background: #7800ff;
            color: black;
        }

        .hidden {
            display: none;
        }

        /* CONTAINER PRINCIPAL - SEM BORDA EXTERNA */
        .container {
            width: 100%;
            max-width: 800px;
            background: transparent;
            padding: 0;
        }

        /* cada linha de campo */
        .field-group {
            margin-bottom: 18px;
        }

        .field-label {
            color: #cccccc;
            font-size: 0.9rem;
            margin-bottom: 4px;
            text-transform: lowercase;
        }

        .field-label:first-letter {
            text-transform: uppercase;
        }

        .field-input {
            width: 100%;
            background: #0a0a0a;
            border: 2px solid #7800ff;
            border-radius: 10px;
            padding: 10px 14px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        .field-input::placeholder {
            color: #444444;
        }

        /* linha de dois elementos lado a lado */
        .row-duo {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .row-duo .left {
            flex: 1;
        }

        .row-duo .right {
            width: 90px;
            min-width: 90px;
        }

        /* método com seta (dropdown personalizado) */
        .method-selector {
            position: relative;
            width: 100%;
            z-index: 20;
        }

        .method-display {
            width: 100%;
            background: #0a0a0a;
            border: 2px solid #7800ff;
            border-radius: 10px;
            padding: 10px 14px;
            color: white;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .method-display::after {
            content: "▼";
            font-size: 0.8rem;
            color: #7800ff;
        }

        .method-dropdown {
            position: absolute;
            top: 110%;
            left: 0;
            right: 0;
            background: #111111;
            border: 2px solid #7800ff;
            border-radius: 10px;
            max-height: 220px;
            overflow-y: auto;
            display: none;
            z-index: 30;
        }

        .method-dropdown.show {
            display: block;
        }

        .method-item {
            padding: 10px 14px;
            color: white;
            cursor: pointer;
            border-bottom: 1px solid #333;
            font-size: 0.9rem;
        }

        .method-item:hover {
            background: #7800ff;
            color: black;
        }

        /* botões layer 4 e 7 */
        .layer-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .layer-btn {
            background: transparent;
            border: 2px solid #7800ff;
            border-radius: 10px;
            color: #7800ff;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 8px 25px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .layer-btn.active {
            background: #7800ff;
            color: black;
        }

        /* botão ataque - cor verde atualizada */
        .attack-btn {
            width: 100%;
            background: #7800ff;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.6rem;
            font-weight: bold;
            padding: 10px 20px;
            margin-top: 20px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: lowercase;
            letter-spacing: 2px;
            box-shadow: 0 0 15px #7800ff;
        }

        .attack-btn:first-letter {
            text-transform: uppercase;
        }

        .attack-btn.loading {
            background: #333333;
            box-shadow: none;
            color: #888;
            position: relative;
        }

        .attack-btn.loading::after {
            content: "◌";
            margin-left: 10px;
            font-size: 1.6rem;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        .attack-btn.sent {
            background: #00ff70;
            box-shadow: 0 0 15px #00ff70;
        }

        .attack-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* barra de progresso roxa */
        .progress-area {
            margin-top: 15px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: #222222;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #7800ff;
            transition: width 0.3s linear;
            border-radius: 10px;
        }

        .time-display {
            text-align: right;
            color: #aaaaaa;
            font-size: 0.85rem;
            margin-top: 5px;
        }

        /* ========== LAYOUT MOBILE ========== */
        .mobile-layout .field-group {
            margin-bottom: 16px;
        }

        .mobile-layout .row-duo {
            display: block;
        }

        .mobile-layout .row-duo .left,
        .mobile-layout .row-duo .right {
            width: 100%;
            min-width: 100%;
            margin-bottom: 8px;
        }

        .mobile-layout .row-duo .right {
            margin-bottom: 0;
        }

        /* ========== LAYOUT PC ========== */
        .pc-layout .field-group {
            margin-bottom: 18px;
        }

        .pc-layout .row-duo {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .pc-layout .row-duo .left {
            flex: 1;
        }

        .pc-layout .row-duo .right {
            width: 90px;
            min-width: 90px;
        }
    </style>
</head>
<body>
    <!-- TELA INICIAL -->
    <div class="splash-screen" id="splash">
        <div class="splash-title">KILLER STRESSER</div>
    </div>

    <!-- TELA DE SELEÇÃO -->
    <div class="selection-screen hidden" id="selectionScreen">
        <div class="selection-box">
            <p>To improve your experience, select:</p>
            <div class="selection-buttons">
                <button class="selection-btn" id="selectMobile">Mobile</button>
                <button class="selection-btn" id="selectPC">PC</button>
            </div>
        </div>
    </div>

    <!-- INTERFACE PRINCIPAL -->
    <div class="container hidden" id="mainInterface">
        <!-- Botões Layer -->
        <div class="layer-buttons">
            <button class="layer-btn active" id="layer7Btn">LAYER 7</button>
            <button class="layer-btn" id="layer4Btn">LAYER 4</button>
        </div>

        <!-- Versão MOBILE -->
        <div id="mobileLayout" class="mobile-layout">
            <div class="field-group">
                <div class="field-label">method</div>
                <div class="method-selector">
                    <div class="method-display" id="methodDisplayMobile">HTTPS-BYPASS</div>
                    <div class="method-dropdown" id="methodDropdownMobile"></div>
                </div>
            </div>

            <div class="field-group">
                <div class="field-label" id="targetLabelMobile">domain or url</div>
                <input type="text" class="field-input" id="domainMobile" placeholder="example.com">
            </div>
            <div class="field-group">
                <div class="field-label">port</div>
                <input type="number" class="field-input" id="portMobile" placeholder="443" value="443">
            </div>

            <div class="field-group">
                <div class="field-label">time</div>
                <input type="number" class="field-input" id="timeMobile" placeholder="60" value="60">
            </div>
            <div class="field-group">
                <div class="field-label">concurrents</div>
                <input type="number" class="field-input" id="concurrentMobile" placeholder="1" value="1" min="1" max="99999">
            </div>

            <button class="attack-btn" id="attackMobile">attack</button>

            <div class="progress-area" id="progressAreaMobile" style="display: none;">
                <div class="progress-bar-bg">
                    <div class="progress-fill" id="progressFillMobile"></div>
                </div>
                <div class="time-display" id="timeDisplayMobile"></div>
            </div>
        </div>

        <!-- Versão PC -->
        <div id="pcLayout" class="pc-layout hidden">
            <div class="field-group">
                <div class="field-label">method</div>
                <div class="method-selector">
                    <div class="method-display" id="methodDisplayPC">HTTPS-BYPASS</div>
                    <div class="method-dropdown" id="methodDropdownPC"></div>
                </div>
            </div>

            <div class="field-group">
                <div class="row-duo">
                    <div class="left">
                        <div class="field-label" id="targetLabelPC">domain or url</div>
                        <input type="text" class="field-input" id="domainPC" placeholder="example.com">
                    </div>
                    <div class="right">
                        <div class="field-label">port</div>
                        <input type="number" class="field-input" id="portPC" placeholder="443" value="443">
                    </div>
                </div>
            </div>

            <div class="field-group">
                <div class="row-duo">
                    <div class="left">
                        <div class="field-label">time</div>
                        <input type="number" class="field-input" id="timePC" placeholder="60" value="60">
                    </div>
                    <div class="right">
                        <div class="field-label">concurrents</div>
                        <input type="number" class="field-input" id="concurrentPC" placeholder="1" value="1" min="1" max="99999">
                    </div>
                </div>
            </div>

            <button class="attack-btn" id="attackPC">attack</button>

            <div class="progress-area" id="progressAreaPC" style="display: none;">
                <div class="progress-bar-bg">
                    <div class="progress-fill" id="progressFillPC"></div>
                </div>
                <div class="time-display" id="timeDisplayPC"></div>
            </div>
        </div>
    </div>

    <script>
        // ---------- LISTAS DE MÉTODOS ----------
        const layer7Methods = [
            "HTTPS-BYPASS", "HTTP-BROWSER", "HTTP-FLOOD", "HTTPS-FLOOD",
            "HTTP-BYPASS", "HTTP-POST", "HTTP-GET", "TLS-HTTP", "TLS-HTTPS",
            "HTTP-BOTNET", "HTTPS-BOTNET", "TLS-BOTNET"
        ];

        const layer4Methods = [
            "UDP-FLOOD", "TCP-SYN", "TCP-ACK", "UDP-GAME", "TCP-RST",
            "UDP-RAW", "TCP-PSH", "UDP-AMP-DNS", "TCP-AMP-CLDAP",
            "UDP-AMP-MEMCACHED", "UDP-BOTNET", "TCP-BOTNET"
        ];

        // ---------- ELEMENTOS ----------
        const splash = document.getElementById('splash');
        const selectionScreen = document.getElementById('selectionScreen');
        const mainInterface = document.getElementById('mainInterface');
        const mobileLayout = document.getElementById('mobileLayout');
        const pcLayout = document.getElementById('pcLayout');
        const selectMobile = document.getElementById('selectMobile');
        const selectPC = document.getElementById('selectPC');
        const layer7Btn = document.getElementById('layer7Btn');
        const layer4Btn = document.getElementById('layer4Btn');

        const targetLabelMobile = document.getElementById('targetLabelMobile');
        const targetLabelPC = document.getElementById('targetLabelPC');
        const domainMobile = document.getElementById('domainMobile');
        const domainPC = document.getElementById('domainPC');

        // Dropdowns
        const methodDisplayMobile = document.getElementById('methodDisplayMobile');
        const methodDropdownMobile = document.getElementById('methodDropdownMobile');
        const methodDisplayPC = document.getElementById('methodDisplayPC');
        const methodDropdownPC = document.getElementById('methodDropdownPC');

        // Botões de ataque
        const attackMobile = document.getElementById('attackMobile');
        const attackPC = document.getElementById('attackPC');
        const progressAreaMobile = document.getElementById('progressAreaMobile');
        const progressAreaPC = document.getElementById('progressAreaPC');
        const progressFillMobile = document.getElementById('progressFillMobile');
        const progressFillPC = document.getElementById('progressFillPC');
        const timeDisplayMobile = document.getElementById('timeDisplayMobile');
        const timeDisplayPC = document.getElementById('timeDisplayPC');

        // Inputs
        const portMobile = document.getElementById('portMobile');
        const portPC = document.getElementById('portPC');
        const timeMobile = document.getElementById('timeMobile');
        const timePC = document.getElementById('timePC');
        const concurrentMobile = document.getElementById('concurrentMobile');
        const concurrentPC = document.getElementById('concurrentPC');

        // ---------- ESTADO ----------
        let currentLayer = '7';
        let currentMethod = 'HTTPS-BYPASS';
        let attackActive = false;
        let progressInterval = null;
        let startTime = 0;
        let totalSeconds = 60;

        // ---------- ANIMAÇÃO INICIAL ----------
        setTimeout(() => {
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.classList.add('hidden');
                selectionScreen.classList.remove('hidden');
            }, 1000);
        }, 3000);

        // ---------- SELEÇÃO MOBILE/PC ----------
        selectMobile.addEventListener('click', () => {
            selectionScreen.classList.add('hidden');
            mainInterface.classList.remove('hidden');
            mobileLayout.classList.remove('hidden');
            pcLayout.classList.add('hidden');
            setupDropdowns();
        });

        selectPC.addEventListener('click', () => {
            selectionScreen.classList.add('hidden');
            mainInterface.classList.remove('hidden');
            pcLayout.classList.remove('hidden');
            mobileLayout.classList.add('hidden');
            setupDropdowns();
        });

        // ---------- CONFIGURA DROPDOWNS ----------
        function setupDropdowns() {
            // Mobile
            populateDropdown(methodDropdownMobile, layer7Methods, (method) => {
                currentMethod = method;
                methodDisplayMobile.textContent = method;
                methodDropdownMobile.classList.remove('show');
            });
            methodDisplayMobile.textContent = currentMethod;

            // PC
            populateDropdown(methodDropdownPC, layer7Methods, (method) => {
                currentMethod = method;
                methodDisplayPC.textContent = method;
                methodDropdownPC.classList.remove('show');
            });
            methodDisplayPC.textContent = currentMethod;

            methodDisplayMobile.onclick = (e) => {
                e.stopPropagation();
                methodDropdownMobile.classList.toggle('show');
            };

            methodDisplayPC.onclick = (e) => {
                e.stopPropagation();
                methodDropdownPC.classList.toggle('show');
            };

            document.addEventListener('click', (e) => {
                if (!methodDisplayMobile.contains(e.target) && !methodDropdownMobile.contains(e.target)) {
                    methodDropdownMobile.classList.remove('show');
                }
                if (!methodDisplayPC.contains(e.target) && !methodDropdownPC.contains(e.target)) {
                    methodDropdownPC.classList.remove('show');
                }
            });
        }

        function populateDropdown(dropdown, methods, onSelect) {
            dropdown.innerHTML = '';
            methods.forEach(method => {
                const item = document.createElement('div');
                item.className = 'method-item';
                item.textContent = method;
                item.onclick = (e) => {
                    e.stopPropagation();
                    onSelect(method);
                };
                dropdown.appendChild(item);
            });
        }

        // ---------- BOTÕES LAYER ----------
        layer7Btn.addEventListener('click', () => {
            layer7Btn.classList.add('active');
            layer4Btn.classList.remove('active');
            currentLayer = '7';
            
            targetLabelMobile.textContent = 'domain or url';
            targetLabelPC.textContent = 'domain or url';
            domainMobile.placeholder = 'example.com';
            domainPC.placeholder = 'example.com';
            
            populateDropdown(methodDropdownMobile, layer7Methods, (method) => {
                currentMethod = method;
                methodDisplayMobile.textContent = method;
                methodDropdownMobile.classList.remove('show');
            });
            populateDropdown(methodDropdownPC, layer7Methods, (method) => {
                currentMethod = method;
                methodDisplayPC.textContent = method;
                methodDropdownPC.classList.remove('show');
            });
            
            if (!layer7Methods.includes(currentMethod)) {
                currentMethod = layer7Methods[0];
                methodDisplayMobile.textContent = currentMethod;
                methodDisplayPC.textContent = currentMethod;
            }
        });

        layer4Btn.addEventListener('click', () => {
            layer4Btn.classList.add('active');
            layer7Btn.classList.remove('active');
            currentLayer = '4';
            
            targetLabelMobile.textContent = 'IP target';
            targetLabelPC.textContent = 'IP target';
            domainMobile.placeholder = '1.1.1.1';
            domainPC.placeholder = '1.1.1.1';
            
            populateDropdown(methodDropdownMobile, layer4Methods, (method) => {
                currentMethod = method;
                methodDisplayMobile.textContent = method;
                methodDropdownMobile.classList.remove('show');
            });
            populateDropdown(methodDropdownPC, layer4Methods, (method) => {
                currentMethod = method;
                methodDisplayPC.textContent = method;
                methodDropdownPC.classList.remove('show');
            });
            
            if (!layer4Methods.includes(currentMethod)) {
                currentMethod = layer4Methods[0];
                methodDisplayMobile.textContent = currentMethod;
                methodDisplayPC.textContent = currentMethod;
            }
        });

        // ---------- FUNÇÃO DE ATAQUE ----------
        function setupAttack(btn, progressArea, progressFill, timeDisplay, domainInput, portInput, timeInput, concurrentInput) {
            btn.onclick = () => {
                if (attackActive || btn.disabled) return;

                const target = domainInput.value.trim();
                if (!target) {
                    alert('Target inválido');
                    return;
                }

                totalSeconds = parseInt(timeInput.value) || 60;
                attackActive = true;
                
                btn.disabled = true;
                btn.classList.add('loading');
                btn.classList.remove('sent');
                btn.textContent = '';

                progressArea.style.display = 'block';

                setTimeout(() => {
                    btn.classList.remove('loading');
                    btn.classList.add('sent');
                    btn.textContent = 'attack sent!';

                    // Botão volta ao normal após 3 segundos
                    setTimeout(() => {
                        btn.classList.remove('sent');
                        btn.textContent = 'attack';
                    }, 3000);

                    startTime = Date.now();
                    
                    if (progressInterval) clearInterval(progressInterval);
                    
                    progressInterval = setInterval(() => {
                        const elapsed = (Date.now() - startTime) / 1000;
                        const percent = Math.min(100, (elapsed / totalSeconds) * 100);
                        progressFill.style.width = percent + '%';
                        timeDisplay.textContent = `${Math.max(0, totalSeconds - elapsed).toFixed(1)}s / ${totalSeconds}s (${Math.floor(percent)}%)`;

                        if (elapsed >= totalSeconds) {
                            clearInterval(progressInterval);
                            progressInterval = null;
                            
                            attackActive = false;
                            btn.disabled = false;
                            
                            progressArea.style.display = 'none';
                            progressFill.style.width = '0%';
                            timeDisplay.textContent = '';

                            domainInput.value = '';
                            portInput.value = '443';
                            timeInput.value = '60';
                            concurrentInput.value = '1';
                        }
                    }, 100);

                }, 3000);
            };
        }

        // Configura ataques
        setupAttack(
            attackMobile, progressAreaMobile, progressFillMobile, timeDisplayMobile,
            domainMobile, portMobile, timeMobile, concurrentMobile
        );

        setupAttack(
            attackPC, progressAreaPC, progressFillPC, timeDisplayPC,
            domainPC, portPC, timePC, concurrentPC
        );

        // Inicializa
        setupDropdowns();
    </script>
</body>
</html>
